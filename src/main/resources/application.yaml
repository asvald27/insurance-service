spring:
  application:
    name: insurance-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: admin
    password: qwerty
    url: jdbc:postgresql://localhost:5432/dev_insurance_db
  jpa:
    hibernate:
      ddl-auto: validate  # или none - Liquibase будет управлять схемой
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: db/changelog/changelog-master.yaml
    default-schema: public
    liquibase-schema: public
    drop-first: false  # ВНИМАНИЕ: true только для dev/тестов
server:
  port: 8083
ms:
  insurance:
    calculator:
      life:
        base-rate-per-thousand: 1.5  # 1.5 на 1000 единиц покрытия
        age-factor:
          young: 1.2      # до 30 лет
          middle: 1.0     # 31-50 лет
          senior: 1.8     # 51-65 лет
          elderly: 2.5    # 66+ лет
        policy-term-factor:
          short-term: 1.1    # до 5 лет
          medium-term: 1.0   # 6-15 лет
          long-term: 0.9     # 16+ лет
        high-risk-occupation-factor: 1.5
        dangerous-hobbies-factor: 1.3
        payment-frequency-factors:
          monthly: 1.0
          quarterly: 0.98
          semi-annual: 0.96
          annual: 0.92
        gender-factor:
          male: 1.1
          female: 1.0
        beneficiary-relation-factor: 1.2
      auto:
        base-rate: ${AUTO_INSURANCE_BASE_RATE:3000.00}
        driver-experience-factor: ${DRIVER_EXPERIENCE_FACTOR:5.6}
        accident-factor: ${CLIENT_ACCIDENT_FACTOR:3.5}
      health:
        base-rate: ${HEALTH_INSURANCE_BASE_RATE:5000.00}      # Можете оставить без .0
        age-factor:
          young: ${INSURANCE_AGE_FACTOR_YOUNG:0.9}
          middle: ${INSURANCE_AGE_FACTOR_MIDDLE:1.0}
          senior: ${INSURANCE_AGE_FACTOR_SENIOR:1.3}
          elderly: 1.1
        smoker-factor: ${INSURANCE_SMOKER_FACTOR:1.5}
        chronic-disease-factor: ${INSURANCE_CHRONIC_DISEASE_FACTOR:1.8}
