version: '3.9'

services:
  db:
    image: postgres:16-alpine   # Используем версию 16
    container_name: insurance_service_db
    environment:
      POSTGRES_DB: dev_insurance_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - insurance_postgres_data:/var/lib/postgresql/data   # Для версии 16 и ниже это путь правильный
    command: postgres -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dev_insurance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  insurance_postgres_data:
